<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beacon - Orbit Express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Beacon</h1><span>Orbit Express order board</span></header>
  <main>
    <section>
      <h2>New order</h2>
      <input id="customer" placeholder="Customer name">
      <input id="item" placeholder="Item">
      <button id="add">Place order</button>
      <p id="msg"></p>
    </section>
    <section>
      <h2>Orders</h2>
      <ul id="orders"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
